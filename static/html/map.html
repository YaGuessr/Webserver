<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Map</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box
      }

      body {
        font-family: Arial, sans-serif
      }

      #map-container {
        position: relative;
        width: 100%;
        height: 100vh
      }

      #map {
        cursor: default;
        width: 100%;
        height: 100%
      }

      .info-panel {
        position: absolute;
        top: 10px;
        right: 10px;
        background: #fff;
        padding: 15px;
        border-radius: 8px;
        box-shadow: 0 2px 6px rgba(0, 0, 0, .3);
        z-index: 1000;
        max-width: 300px
      }

      .info-panel h3 {
        margin-bottom: 10px;
        color: #333
      }

      .coordinates {
        font-family: monospace;
        font-size: 14px;
        color: #555;
        margin: 5px 0
      }

      .btn {
        background: #4285f4;
        color: #fff;
        border: none;
        padding: 8px 16px;
        border-radius: 4px;
        cursor: pointer;
        margin-top: 10px;
        font-size: 14px;
        width: 100%
      }

      .btn:hover {
        background: #3367d6
      }

      .btn-clear {
        background: #ea4335
      }

      .btn-clear:hover {
        background: #c5221f
      }

      .instructions {
        position: absolute;
        bottom: 10px;
        left: 10px;
        background: rgba(255, 255, 255, .95);
        padding: 10px 15px;
        border-radius: 8px;
        box-shadow: 0 2px 6px rgba(0, 0, 0, .3);
        z-index: 1000;
        font-size: 14px
      }

      .layer-switcher {
        position: absolute;
        top: 10px;
        left: 10px;
        background: #fff;
        padding: 10px;
        border-radius: 8px;
        box-shadow: 0 2px 6px rgba(0, 0, 0, .3);
        z-index: 1000
      }

      .layer-switcher label {
        display: block;
        margin: 5px 0;
        cursor: pointer
      }

      .layer-switcher input {
        margin-right: 5px
      }
    </style>
  </head>
  <body>
    <div id="map-container">
      <div id="map"></div>
      <div class="layer-switcher" style="display:none">
        <strong>Тип карты:</strong>
        <label>
          <input type="radio" name="layer" value="google-hybrid" checked="checked"> Google Спутник + надписи </label>
        <label>
          <input type="radio" name="layer" value="google-satellite"> Google Спутник </label>
        <label>
          <input type="radio" name="layer" value="google-street"> Google Схема </label>
      </div>
      <div class="info-panel" style="display:none">
        <h3>📍 Координаты метки</h3>
        <div id="marker-info">
          <p>Кликните на карту, чтобы поставить метку</p>
        </div>
        <button class="btn btn-clear" onclick="clearMarker()">Удалить метку</button>
      </div>
      <div class="instructions" style="display:none">💡 Google Maps без API ключа! Кликните на карту для метки</div>
    </div>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
      let map;
      let marker = null;
      let currentLayer = null;
      // Google Maps тайлы БЕЗ API ключа!
      const googleLayers = {
        // Спутник + надписи (как в OpenGuessr)
        'google-hybrid': L.tileLayer('https://mt{s}.google.com/vt/lyrs=y&x={x}&y={y}&z={z}', {
          attribution: '© Google',
          maxZoom: 20,
          subdomains: '0123'
        }),
        // Только спутник
        'google-satellite': L.tileLayer('https://mt{s}.google.com/vt/lyrs=s&x={x}&y={y}&z={z}', {
          attribution: '© Google',
          maxZoom: 20,
          subdomains: '0123'
        }),
        // Схема
        'google-street': L.tileLayer('https://mt{s}.google.com/vt/lyrs=m&x={x}&y={y}&z={z}', {
          attribution: '© Google',
          maxZoom: 20,
          subdomains: '0123'
        }),
        // Альтернативный спутник + надписи (как вы нашли)
        'google-hybrid-alt': L.tileLayer('https://mt{s}.google.com/vt/lyrs=s,h&x={x}&y={y}&z={z}', {
          attribution: '© Google',
          maxZoom: 20,
          subdomains: '0123'
        })
      };

      function initMap() {
        map = L.map('map', {
          center: [55.8005, 49.0813],
          zoom: 10,
          zoomControl: true,
          scrollWheelZoom: true,
          dragging: true,
          doubleClickZoom: true
        });
        // По умолчанию - спутник + надписи
        currentLayer = googleLayers['google-hybrid'];
        currentLayer.addTo(map);
        // Клик по карте
        map.on('click', function(e) {
          placeMarker(e.latlng);
        });
        // Переключатель слоев
        document.querySelectorAll('input[name="layer"]').forEach(radio => {
          radio.addEventListener('change', function(e) {
            switchLayer(e.target.value);
          });
        });
        document.querySelectorAll(".leaflet-control-attribution.leaflet-control").forEach((it) => {
          it.remove();
        });
        document.querySelectorAll(".leaflet-control-zoom.leaflet-bar.leaflet-control").forEach((it) => {
          it.remove();
        });
      }

      function switchLayer(type) {
        if (currentLayer) {
          map.removeLayer(currentLayer);
        }
        currentLayer = googleLayers[type];
        currentLayer.addTo(map);
      }

      function placeMarker(latlng) {
        if (marker) {
          map.removeLayer(marker);
        }
        // Создаем кастомную иконку
        const customIcon = L.icon({
          iconUrl: 'static/media/marker.png',
          iconSize: [30, 30],
          iconAnchor: [14, 28],
          popupAnchor: [14, 28]
        });
        marker = L.marker(latlng, {
          icon: customIcon,
          draggable: true
        }).addTo(map);
        updateMarkerInfo();
        marker.on('dragend', function(e) {
          updateMarkerInfo();
        });
      }

      function updateMarkerInfo() {
        if (!marker) return;
        const position = marker.getLatLng();
        const lat = position.lat.toFixed(6);
        const lng = position.lng.toFixed(6);
        const infoDiv = document.getElementById('marker-info');
        infoDiv.innerHTML = `
                
									<div class="coordinates">
										<strong>Широта:</strong> ${lat}°
										<br>
											<strong>Долгота:</strong> ${lng}°
                
										</div>
										<div style="margin-top: 10px; font-size: 12px; color: #777;">
                    Формат для GeoGuesser:
											<br>
                    ${lat}, ${lng}
                
											</div>
            `;
        document.title = `${lat} ${lng}`
      }

      function clearMarker() {
        if (marker) {
          map.removeLayer(marker);
          marker = null;
          document.getElementById('marker-info').innerHTML = ' < p > Кликните на карту, чтобы поставить метку < /p>';
        }
      }

      function getMarkerCoordinates() {
        if (marker) {
          const position = marker.getLatLng();
          return {
            lat: position.lat,
            lng: position.lng
          };
        }
        return null;
      }

      function setMarkerByCoordinates(lat, lng) {
        const latlng = L.latLng(lat, lng);
        placeMarker(latlng);
        map.setView(latlng, map.getZoom());
      }
      document.addEventListener('DOMContentLoaded', initMap);
    </script>
  </body>
</html>
